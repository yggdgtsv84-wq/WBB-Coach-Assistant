<script>
// Practice drills use user_id in Supabase (not team_id).
window.addDrill=async function(){
  const name=prompt("Drill name");
  if(!name)return;
  const minutes=Number(prompt("Minutes"));
  if(!Number.isFinite(minutes)||minutes<=0)return;
  try{
    const key=String(window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_ANON_KEY||"").trim();
    const client=window.supabase.createClient(String(window.SUPABASE_URL).trim(),key,{auth:{persistSession:true}});
    const session=await client.auth.getSession();
    const currentUser=session.data?.session?.user;
    if(!currentUser)return alert("Please sign in again.");
    const r=await client.from("drills").insert({user_id:currentUser.id,name:name.trim(),minutes}).select().single();
    if(r.error)return alert(r.error.message);
    location.reload();
  }catch(e){alert(e.message||e)}
};
</script>
<script src="practice-session.js?v=3"></script>
