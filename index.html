<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06284A"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>West Belconnen Coach</title></head><body><header><button id="menu">☰</button><div><b>WEST BELCONNEN</b><small>BASKETBALL • COACH ASSISTANT</small></div><span id="team">TEAM</span></header><main id="app"></main><nav><button data-s="home">⌂<small>Home</small></button><button data-s="game">🏀<small>Game</small></button><button data-s="practice">⏱<small>Practice</small></button><button data-s="season">📊<small>Season</small></button></nav><aside id="drawer" class="hide"><div><button id="close">×</button><button data-s="home">⌂ Home</button><button data-s="game">🏀 Game</button><button data-s="bench">🔄 Bench</button><button data-s="history">📅 Game History</button><button data-s="practice">⏱ Practice</button><button data-s="season">📊 Season</button><button data-s="teams">👕 Teams & Players</button><button data-s="settings">⚙ Settings</button></div></aside><script>
(async()=>{try{
  if("serviceWorker" in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
  }
  if("caches" in window){
    const ks=await caches.keys();
    await Promise.all(ks.map(k=>caches.delete(k)));
  }
}catch(e){}
const s=document.createElement("script");
s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
s.onload=()=>{
  const c=document.createElement("script");
  c.src="config.js?fresh=3";
  c.onload=()=>{
    const a=document.createElement("script");
    a.src="app.js?fresh=3";
    document.body.appendChild(a);
  };
  document.body.appendChild(c);
};
s.onerror=()=>document.getElementById("app").innerHTML='<div class="auth"><div class="card"><h1>Coach Assistant</h1><div class="error">Could not load the Supabase library. Check your internet connection and reload.</div></div></div>';
document.head.appendChild(s);
})();
</script></body></html>
